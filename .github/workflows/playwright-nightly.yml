name: playwright-nightly

# Parcours Playwright nocturne sur deux scénarios avec LLM simulé (USE_FAKE_LLMOPS=1 + FAKE_LLM_DETERMINISTIC=1).
# Vérifie les parcours navigateur de bout en bout sans dépendre d'une clé LLM externe ni d'un serveur Hub distant.

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: playwright-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      USE_FAKE_LLMOPS: "1"
      FAKE_LLM_DETERMINISTIC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Préparer l'environnement de test (OPA, Prisma, SvelteKit)
        run: node scripts/ensure-test-env.mjs

      - name: Exécuter les deux scénarios Playwright (LLM simulé)
        run: |
          npx playwright test \
            tests/e2e/browser/regulatory-to-capitalization.spec.ts \
            tests/e2e/browser/second-rfp-reuse.spec.ts \
            --project=chromium

      - name: Publier le rapport Playwright et les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-report
          path: |
            playwright-report/
            tests/e2e/screenshots/
            test-results/artifacts/
          retention-days: 14
          if-no-files-found: ignore
