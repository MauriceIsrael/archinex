name: verify

# Porte qualité unique : garde-fou denylist, tests, types Svelte, build de production.
# C'est la commande locale `npm run verify`, exécutée sur un clone propre.
#
# Déclencheurs : les PR et `main`. Sans filtre sur `push`, une branche avec une PR ouverte lançait deux runs à chaque push
# (un pour le push, un pour la PR). Une branche sans PR n'est pas vérifiée ici : ouvrir la PR, en brouillon au besoin.
#
# Les tests « live » (contre un vrai serveur LLMOps) et les parcours Playwright ne tournent pas ici :
# ils exigent un LLMOps réel (LLMOPS_LIVE_URL ou Docker) et sont ignorés sans lui.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # Aucune clé de modèle n'est fournie en CI : les tests n'appellent jamais un vrai LLM.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Créer la base SQLite et générer le client Prisma
        run: npx prisma generate && npx prisma db push

      - name: Vérifier (denylist, tests, types, build)
        run: npm run verify
