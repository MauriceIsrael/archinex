# Environnement d'intégration local pour la validation EDP & Telco-Cloud (écosystème Sylva)
# Fournit :
#  - Nautobot 2.x (DCIM/IPAM SSOT) + PostgreSQL 15 + Redis 7 + Celery Worker (#351)
#  - Batfish (Simulateur de plan de contrôle et matrice de flux réseau) (#353)
#  - Open Policy Agent (OPA) en mode serveur HTTP REST
#  - sushy-emulator (Bouchon Redfish BMC in-memory)
#  - OpenBao (Secrets & PKI X.509) (#354)
#  - Keycloak (IdP / IAM OIDC) (#357)
#  - Zot + Trivy Server (Registre OCI / Cosign + Scan CVE/SBOM) (#355)
#  - Technitium DNS Server (DDI / DNS avec API REST) (#352)
#  - Forgejo (Forge GitOps PR/MR & CI locale légère) (#356)
#
# Usage :
#   powershell .\tools.ps1 up
#   ou : docker compose -f compose.yml up -d

name: archinex-integrator-tools

services:
  nautobot-db:
    image: postgres:15-alpine
    container_name: archinex-nautobot-db
    environment:
      POSTGRES_DB: nautobot
      POSTGRES_USER: nautobot
      POSTGRES_PASSWORD: nautobotpassword
    volumes:
      - nautobot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautobot -d nautobot"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  nautobot-redis:
    image: redis:7-alpine
    container_name: archinex-nautobot-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped

  nautobot:
    image: ghcr.io/nautobot/nautobot:2.2-py3.11
    container_name: archinex-nautobot-app
    user: "0:0"
    depends_on:
      nautobot-db:
        condition: service_healthy
      nautobot-redis:
        condition: service_healthy
    environment:
      NAUTOBOT_DB_ENGINE: django.db.backends.postgresql
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: nautobotpassword
      NAUTOBOT_DB_HOST: nautobot-db
      NAUTOBOT_DB_PORT: "5432"
      NAUTOBOT_REDIS_HOST: nautobot-redis
      NAUTOBOT_REDIS_PORT: "6379"
      NAUTOBOT_SECRET_KEY: "archinex-super-secret-key-for-local-integrator-verification-32chars-min"
      NAUTOBOT_ALLOWED_HOSTS: "*"
      NAUTOBOT_CREATE_SUPERUSER: "true"
      NAUTOBOT_SUPERUSER_NAME: admin
      NAUTOBOT_SUPERUSER_PASSWORD: adminpassword
      NAUTOBOT_SUPERUSER_EMAIL: admin@archinex.local
      NAUTOBOT_SUPERUSER_API_TOKEN: "0123456789abcdef0123456789abcdef01234567"
      NAUTOBOT_AUTO_MIGRATE: "true"
    volumes:
      - ./seed-nautobot.py:/opt/nautobot/seed-nautobot.py:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20
    restart: unless-stopped

  nautobot-worker:
    image: ghcr.io/nautobot/nautobot:2.2-py3.11
    container_name: archinex-nautobot-worker
    user: "0:0"
    depends_on:
      nautobot:
        condition: service_healthy
    environment:
      NAUTOBOT_DB_ENGINE: django.db.backends.postgresql
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: nautobotpassword
      NAUTOBOT_DB_HOST: nautobot-db
      NAUTOBOT_DB_PORT: "5432"
      NAUTOBOT_REDIS_HOST: nautobot-redis
      NAUTOBOT_REDIS_PORT: "6379"
      NAUTOBOT_SECRET_KEY: "archinex-super-secret-key-for-local-integrator-verification-32chars-min"
    command: ["nautobot-server", "celery", "worker", "-l", "INFO"]
    restart: unless-stopped

  batfish:
    image: batfish/batfish:latest
    container_name: archinex-batfish
    ports:
      - "127.0.0.1:9997:9997" # Client API / pybatfish
      - "127.0.0.1:9996:9996" # Coordinator SSL
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    container_name: archinex-opa-server
    command: ["run", "--server", "--addr", ":8181", "--log-level", "info"]
    ports:
      - "127.0.0.1:8181:8181"
    restart: unless-stopped

  sushy-emulator:
    image: quay.io/metal3-io/sushy-tools:latest
    container_name: archinex-sushy-emulator
    command: ["sushy-emulator", "--config", "/etc/sushy/sushy-emulator.conf"]
    volumes:
      - ./sushy-emulator.conf:/etc/sushy/sushy-emulator.conf:ro
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/redfish/v1/Systems\")' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  openbao:
    image: openbao/openbao:latest
    container_name: archinex-openbao
    command: ["server", "-dev", "-dev-root-token-id=archinex-bao-dev-token", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: archinex-bao-dev-token
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: archinex-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminpassword
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8085:8080"
    restart: unless-stopped

  zot:
    image: ghcr.io/project-zot/zot:latest
    container_name: archinex-zot-registry
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - zot-data:/var/lib/registry
    restart: unless-stopped

  trivy:
    image: aquasec/trivy:latest
    container_name: archinex-trivy-server
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports:
      - "127.0.0.1:4954:4954"
    volumes:
      - trivy-cache:/root/.cache/
    restart: unless-stopped

  dns:
    image: technitium/dns-server:latest
    container_name: archinex-ddi-dns
    environment:
      DNS_SERVER_DOMAIN: archinex.local
      DNS_SERVER_ADMIN_PASSWORD: adminpassword
    ports:
      - "127.0.0.1:5380:5380"
      - "127.0.0.1:15353:53/udp"
      - "127.0.0.1:15353:53/tcp"
    volumes:
      - dns-data:/etc/dns
    restart: unless-stopped

  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: archinex-forgejo
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: "http://127.0.0.1:3001/"
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:2222:22"
    volumes:
      - forgejo-data:/data
    restart: unless-stopped

volumes:
  nautobot-db-data:
  zot-data:
  trivy-cache:
  dns-data:
  forgejo-data:
